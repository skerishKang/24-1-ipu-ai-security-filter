name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Engine, backend, and frontend smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      IPU_AUDIO_TRANSCRIBER: placeholder
      IPU_OLLAMA_ENABLED: "false"
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
          grep -v '^-e ' backend/requirements.txt > /tmp/ipu-backend-requirements.txt
          python -m pip install -r /tmp/ipu-backend-requirements.txt

      - name: Run Python lint
        run: ruff check backend/ engine/ --ignore=E501,F401,E402

      - name: Run engine tests
        run: |
          python -m unittest \
            engine.tests.test_detector_sensitive_patterns \
            engine.tests.test_manual_preview_engine \
            engine.tests.test_local_rewriter

      - name: Run backend tests
        working-directory: backend
        run: |
          python -m unittest \
            tests.test_manual_preview_api \
            tests.test_manual_preview_local_rewrite_api \
            tests.test_manual_preview_restore_limits \
            tests.test_manual_preview_response_mode \
            tests.test_upload_guardrails \
            tests.test_upload_concurrent_requests \
            tests.test_upload_streaming_read_guard \
            tests.test_file_parser \
            tests.test_audio_duration_prober \
            tests.test_parser_limit_coverage \
            tests.test_pdf_quality_samples

      - name: Install frontend smoke dependencies
        working-directory: frontend
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

    - name: Run frontend smoke tests
      working-directory: frontend
      run: node tests/runSmokeTests.js

    - name: Run frontend unit tests
      working-directory: frontend
      run: node tests/resultRendering.test.js
