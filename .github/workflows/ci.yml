name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Engine, backend, and frontend smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      IPU_AUDIO_TRANSCRIBER: placeholder
      IPU_OLLAMA_ENABLED: "false"
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
          grep -v '^-e ' backend/requirements.txt > /tmp/ipu-backend-requirements.txt
          python -m pip install -r /tmp/ipu-backend-requirements.txt

      - name: Run Python lint (informational)
        run: ruff check backend/ engine/ --ignore=E501,F401,E402 --exit-zero

      - name: Check changed files are lint-clean (blocking)
        if: github.event_name == 'pull_request'
        run: |
          CHANGED=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            -- '*.py')
          if [ -n "$CHANGED" ]; then
            ruff check $CHANGED --ignore=E501,F401,E402,B008,BLE001,RUF012
          fi

      - name: Run engine tests
        run: |
          python -m unittest \
            engine.tests.test_detector_sensitive_patterns \
            engine.tests.test_manual_preview_engine \
            engine.tests.test_local_rewriter

      - name: Run backend tests
        working-directory: backend
        run: |
          python -m unittest \
            tests.test_manual_preview_api \
            tests.test_manual_preview_local_rewrite_api \
            tests.test_manual_preview_restore_limits \
            tests.test_manual_preview_response_mode \
            tests.test_upload_guardrails \
            tests.test_upload_concurrent_requests \
            tests.test_upload_streaming_read_guard \
            tests.test_file_parser \
            tests.test_audio_duration_prober \
            tests.test_parser_limit_coverage \
            tests.test_pdf_quality_samples

      - name: Install frontend smoke dependencies
        working-directory: frontend
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run frontend-backend live integration tests
        run: |
          cleanup() {
            kill "$BACKEND_PID" "$FRONTEND_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          python -m uvicorn app.main:app \
            --app-dir backend \
            --host 127.0.0.1 \
            --port 8241 &
          BACKEND_PID=$!

          python -m http.server 4241 \
            --directory frontend \
            --bind 127.0.0.1 &
          FRONTEND_PID=$!

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8241/health >/dev/null \
              && curl -fsS http://127.0.0.1:4241/ >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:8241/health >/dev/null
          curl -fsS http://127.0.0.1:4241/ >/dev/null

          cd frontend
          node tests/runLiveIntegrationTests.js

      - name: Run frontend smoke tests
        working-directory: frontend
        run: node tests/runSmokeTests.js

      - name: Run frontend unit tests
        working-directory: frontend
        run: node tests/resultRendering.test.js
